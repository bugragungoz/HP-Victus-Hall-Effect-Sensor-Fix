  read_guide: Baca panduan
  other_langs: Bahasa lain
  summary:
    title: Ringkasan
    symptom_k: Gejala
    symptom: Lampu latar layar dan keyboard mati atau berkedip secara acak, terutama saat beban panas tinggi; sistem berperilaku seolah-olah layar laptop sedang ditutup.
    cause_k: Penyebab
    cause: Sekring FU6 pada jalur suplai 3,3 V sensor Hall menurun kualitasnya akibat panas dan resistansinya naik; sensor Toshiba TCS40DLR (LA8) bawaan juga hanya dirancang hingga 85 °C.
    fix_k: Solusi
    fix: Ganti sensor dengan Allegro A1126 dan bypass FU6 (atau pasang sekring baru). Melakukan salah satunya saja tidak cukup.
    level_k: Tingkat
    level: 'Lanjutan: menyolder SMD, membaca skematik, dan pengukuran dengan multimeter. Motherboard dan heatsink harus dilepas.'
  diagram:
    title: Jalur suplai sensor Hall
    mb: Motherboard
    sb: Papan sensor
    rail: Jalur 3V3
    cable: Kabel FFC
    sensor: Sensor Hall
    ec: EC
    out: Keluaran (FFC)
    light: Lampu latar layar dan keyboard
    caption: FU6 terpasang seri dengan suplai sensor, sehingga setiap kenaikan resistansinya menurunkan tegangan sebelum sampai ke sensor. Ini adalah gambaran sederhana di tingkat blok; keluaran sensor dapat melewati rangkaian perantara di motherboard sebelum sampai ke EC.
  variant:
    title: Tidak menemukan FU6 di papan Anda?
    p1: Panduan ini dibuat berdasarkan motherboard milik saya sendiri, di mana sekringnya berlabel FU6 dan terletak tepat di sebelah soket JIR1. Pada varian papan lain (misalnya yang berprosesor Intel) sekring yang setara kemungkinan berada di sisi belakang motherboard dengan label FN2; informasi ini berasal dari kasus di forum dan belum pasti. Untuk menemukan sekring, telusuri jalur 3,3 V sensor Hall ke belakang mulai dari soket JIR1.
    p2: 'Untuk diagnosis pasti apakah sekring masih baik, kedua pengukuran berikut harus dilakukan:'
    items:
    - Saat papan tidak bertegangan, sekring harus lolos uji kontinuitas di antara kedua ujungnya (buzzer harus berbunyi). Jika buzzer tidak berbunyi dan multimeter menunjukkan nilai resistansi, sekring telah rusak.
    - Saat papan bertegangan, tidak boleh ada penurunan tegangan yang berarti di antara kedua ujung sekring; pada sekring yang baik penurunan ini praktis nol dan tidak lebih dari beberapa mV. Pada FU6 saya yang rusak, saya mengukur 30 mV.
    p3: 'Berhati-hatilah saat mengukur dalam keadaan bertegangan: ujung probe yang tergelincir dapat menghubungsingkatkan pin di sebelahnya dan merusak perangkat keras. Tentukan terlebih dahulu dengan uji kontinuitas saat papan tidak bertegangan, pin mana yang harus membawa 3V3.'
  checklist:
    title: Setelah perbaikan
    items:
    - Periksa semua sambungan solder dengan uji kontinuitas.
    - Saat papan tidak bertegangan, tentukan dengan uji kontinuitas pin JIR1 mana yang harus membawa 3V3; lalu ukur 3,3 V pada pin tersebut dengan hati-hati saat papan bertegangan.
    - Pasang kembali heatsink dengan pasta termal baru dan kencangkan sekrup sesuai urutannya.
    - Nyalakan lampu latar keyboard lalu buka dan tutup layar beberapa kali; layar dan lampu latar harus mengikuti posisi layar dengan benar.
    - Jalankan uji stres termal dalam waktu lama dan perhatikan apakah ada kedipan atau lampu latar yang mati.
  disclaimer:
    title: 'Sebelum mulai: penafian'
    p1: Saya bukan teknisi reparasi, saya mahasiswa teknik elektro dan elektronika. Isi panduan ini didasarkan pada informasi yang saya kumpulkan dari internet, interpretasi saya terhadap datasheet, kesimpulan saya sendiri, serta pekerjaan dan pengukuran yang saya lakukan sendiri pada perangkat saya; tidak ada jaminan hasilnya akan sama pada setiap perangkat.
    p2: 'Semua pengukuran dan pekerjaan dalam panduan ini sepenuhnya menjadi tanggung jawab Anda sendiri. Perhatikan terutama hal-hal berikut:'
    items:
    - Sebelum menyolder atau membongkar, cabut charger, pastikan perangkat tidak bertegangan, dan lepaskan konektor baterai.
    - Saat pengukuran bertegangan, ujung probe yang tergelincir dapat menghubungsingkatkan pin di sebelahnya dan merusak perangkat keras; gunakan probe berujung runcing dan tahan dengan stabil di atas pad.
    - Saat menggunakan udara panas, lindungi kapasitor kecil di dekat sensor dan soket seperti JIR2 dengan selotip Kapton.
    - Lakukan tindakan pencegahan terhadap pelepasan muatan listrik statis (ESD) saat bekerja pada papan.
    - Jika heatsink sudah dilepas, ganti pasta termal dan kencangkan sekrup sesuai urutannya.
    - Jika ragu pada suatu langkah, berhentilah dan minta bantuan orang yang berpengalaman.
