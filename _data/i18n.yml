en:
  brand: Victus 16 Hall sensor guide
  description: Diagnosing and repairing the Hall effect sensor and FU6 fuse failure in HP Victus 16 laptops (Toshiba TCS40DLR LA8 to Allegro A1126).
  skip: Skip to content
  contents: Contents
  language: Language
  theme: Switch light/dark theme
  repo: GitHub repository
  preview: Image preview
  close: Close
  figure: Figure
  anchor: Link to this section
  zoom: Click to enlarge
  read_guide: Read the guide
  other_langs: Other languages
  support:
    title: Did this help?
    text: If the guide helped you fix your laptop, a star on GitHub helps other Victus owners find it.
    cta: Star on GitHub
  summary:
    title: At a glance
    symptom_k: Symptom
    symptom: Screen and keyboard backlight turn off or flicker at random, mostly under high thermal load; the system behaves as if the lid were closed.
    cause_k: Cause
    cause: The FU6 fuse on the Hall sensor's 3.3 V supply degrades with heat and its resistance rises; the original Toshiba TCS40DLR (LA8) sensor is also rated only up to 85 °C.
    fix_k: Fix
    fix: Replace the sensor with an Allegro A1126 and bypass FU6 (or fit a new fuse). Doing only one of the two is not enough.
    level_k: Level
    level: 'Advanced: SMD soldering, schematic reading and multimeter measurements. The motherboard and the heatsink have to be removed.'
  diagram:
    title: Supply path of the Hall sensor
    mb: Motherboard
    sb: Sensor board
    rail: 3V3 rail
    cable: FFC cable
    sensor: Hall sensor
    ec: EC
    out: Output (FFC)
    light: Screen and keyboard backlight
    caption: FU6 is in series with the sensor's supply, so any resistance it gains drops voltage before it reaches the sensor. This is a simplified, block-level view; the sensor output may pass through intermediate circuitry on the motherboard before it reaches the EC.
  variant:
    title: Can't find FU6 on your board?
    p1: This guide is based on my own motherboard, where the fuse is labelled FU6 and sits right next to the JIR1 connector. On other board variants (for example Intel based ones) the equivalent fuse is likely to be on the back side of the motherboard, labelled FN2; this comes from forum cases and is not certain. To locate the fuse, follow the Hall sensor's 3.3V line back from the JIR1 connector.
    p2: 'For a definite diagnosis of whether the fuse is healthy, both of these measurements should be done:'
    items:
    - With the board de-energized, the fuse must pass a continuity test between its two ends (the buzzer must sound). If the buzzer stays silent and the multimeter shows a resistance value, the fuse has degraded.
    - With the board energized, there must be no noticeable voltage drop between the two ends of the fuse; on a healthy fuse this drop is practically zero and does not exceed a few mV. On my faulty FU6 I measured 30mV.
    p3: 'Be careful when measuring live: a slipping probe tip can short neighbouring pins and damage the hardware. First determine with a continuity test, while the board is de-energized, which pin must carry 3V3.'
  checklist:
    title: After the repair
    items:
    - Check every solder joint with a continuity test.
    - With the board powered off, find by continuity which JIR1 pin must carry 3V3; then carefully measure 3.3 V on that pin with the board powered.
    - Refit the heatsink with fresh thermal paste and tighten the screws in the torque order.
    - Turn on the keyboard backlight and open and close the lid a few times; screen and backlight should follow the lid correctly.
    - Run a long thermal stress test and watch for flicker or backlight dropouts.
  disclaimer:
    title: 'Before you start: disclaimer'
    p1: I am not a repair technician; I am an electrical and electronics engineering student. What this guide describes is based on information I compiled from the internet, my reading of the datasheets, my own conclusions, and the work and measurements I personally carried out on my own device; there is no guarantee that it will give the same result on every device.
    p2: 'All measurements and operations in this guide are entirely at your own responsibility. Pay particular attention to the following:'
    items:
    - Before any soldering or disassembly, unplug the charger, make sure the device is de-energized and disconnect the battery connector.
    - During live measurements a slipping probe tip can short neighbouring pins and damage the hardware; use fine-tip probes and keep them steady on the pads.
    - When using hot air, protect the small capacitors near the sensor and connectors such as JIR2 with kapton tape.
    - Take precautions against electrostatic discharge (ESD) while working on the board.
    - If the heatsink has been removed, renew the thermal paste and tighten the screws in the torque order.
    - If you are unsure about a step, stop and get help from someone experienced.
tr:
  brand: Victus 16 Hall sensör rehberi
  description: HP Victus 16 laptoplarda hall effect sensör ve FU6 sigorta arızasının teşhisi ve donanımsal çözümü (Toshiba TCS40DLR LA8 yerine Allegro A1126).
  skip: İçeriğe geç
  contents: İçindekiler
  language: Dil
  theme: Açık/koyu temayı değiştir
  repo: GitHub deposu
  preview: Görsel önizleme
  close: Kapat
  figure: Şekil
  anchor: Bu bölümün bağlantısı
  zoom: Büyütmek için tıklayın
  read_guide: Rehberi oku
  other_langs: Diğer diller
  support:
    title: İşinize yaradı mı?
    text: Rehber işinize yaradıysa GitHub'da yıldız vererek başka Victus kullanıcılarının da bulmasına yardımcı olabilirsiniz.
    cta: GitHub'da yıldız ver
  summary:
    title: Kısaca
    symptom_k: Belirti
    symptom: Ekran ve klavye aydınlatmasının özellikle yüksek termal yük altında rastgele kapanması veya titremesi; sistem kapak kapanmış gibi davranıyor.
    cause_k: Neden
    cause: Hall sensörün 3.3V besleme hattındaki FU6 sigortası ısıdan bozularak direnç kazanıyor; orijinal Toshiba TCS40DLR (LA8) sensör de en fazla 85°C için tasarlanmış.
    fix_k: Çözüm
    fix: Sensörün Allegro A1126 ile değiştirilmesi ve FU6'nın bypass edilmesi (veya yeni sigorta takılması). Tek başına biri yeterli değil.
    level_k: Seviye
    level: 'İleri: SMD lehimleme, şematik okuma ve multimetre ile ölçüm. Anakart ve soğutucu sökülmek zorunda.'
  diagram:
    title: Hall sensörün besleme yolu
    mb: Anakart
    sb: Sensör kartı
    rail: 3V3 hattı
    cable: FFC kablo
    sensor: Hall sensör
    ec: EC
    out: Çıkış (FFC)
    light: Ekran ve klavye aydınlatması
    caption: FU6 sensörün beslemesine seri bağlı, dolayısıyla sigortanın kazandığı her direnç gerilimi sensöre ulaşmadan düşürüyor. Blok seviyesinde, sadeleştirilmiş bir gösterimdir; sensör çıkışı EC'ye ulaşmadan önce anakart üzerindeki ara devrelerden geçebilir.
  variant:
    title: Kartınızda FU6'yı bulamıyor musunuz?
    p1: Bu rehber kendi anakartım üzerinden anlatıldı; bende sigorta FU6 ismiyle JIR1 soketinin hemen yanında bulunuyor. Farklı varyant anakartlarda (örneğin Intel işlemcili olanlarda) eşdeğer sigortanın anakartın arka yüzeyinde FN2 ismiyle bulunması muhtemel; bu bilgi forumlardaki vakalardan geliyor ve kesin değil. Sigortayı bulmak için hall sensörün 3.3V hattı JIR1 soketinden geriye doğru takip edilebilir.
    p2: 'Sigortanın sağlam olup olmadığına dair kesin tanı için iki ölçüm birlikte yapılmalıdır:'
    items:
    - Kart enerjisizken sigortanın iki ucu arasında süreklilik testi geçmelidir (buzzer ötmelidir). Buzzer ötmüyor ve multimetre bir direnç değeri gösteriyorsa sigorta bozulmuştur.
    - Kart enerjiliyken sigortanın iki ucu arasında kayda değer bir gerilim düşümü olmamalıdır; sağlam bir sigortada bu düşüm pratikte sıfıra yakındır ve birkaç mV'u geçmez. Benim bozuk FU6 sigortamda 30mV ölçmüştüm.
    p3: 'Enerjili ölçüm yapılırken dikkatli olunmalıdır: prob ucunun kayması komşu pinleri kısa devre ederek donanım hasarına yol açabilir. Hangi pinde 3V3 olması gerektiği önce kart enerjisizken süreklilik testi ile belirlenmelidir.'
  checklist:
    title: Onarım sonrası kontrol
    items:
    - Tüm lehimlerin sağlamlığını süreklilik testi ile kontrol edin.
    - Kart enerjisizken süreklilik testi ile JIR1 soketinde hangi pinde 3V3 görülmesi gerektiğini belirleyin; ardından kart enerjiliyken dikkatle o pinde 3.3V ölçün.
    - Soğutucuyu yeni termal macun ile takın, vidaları tork sırasına göre sıkın.
    - Klavye aydınlatmasını açıp kapağı birkaç kez açıp kapatın; ekran ve aydınlatma kapağa doğru tepki vermeli.
    - Uzun süreli termal stres testi yapıp titreme veya aydınlatma kesintisi olup olmadığını gözlemleyin.
  disclaimer:
    title: 'Okumadan önce: sorumluluk reddi'
    p1: Ben tamirci değilim, elektrik elektronik mühendisliği öğrencisiyim. Bu rehberde anlatılanlar internetten derlediğim bilgilere, datasheet yorumlarıma, kendi çıkarımlarıma ve kendi cihazımda bizzat yaptığım işlem ve ölçümlere dayanmaktadır; her cihazda aynı sonucu vereceği garanti edilemez.
    p2: 'Rehberdeki tüm ölçümler ve işlemler tamamen kişinin kendi sorumluluğundadır. Özellikle şunlara dikkat edilmelidir:'
    items:
    - Lehim ve söküm işlemlerinden önce adaptör çıkarılmalı, cihaz enerjisiz hale getirilmeli ve batarya soketi sökülmelidir.
    - Enerjili ölçümlerde prob ucunun kayması komşu pinleri kısa devre ederek donanım hasarına yol açabilir; ince uçlu prob kullanılmalı ve problar pad üzerinde sabit tutulmalıdır.
    - Sıcak hava kullanılırken sensöre yakın küçük kapasitörler ve JIR2 gibi soketler kapton bant ile korunmalıdır.
    - Kart üzerinde çalışırken statik elektriğe (ESD) karşı önlem alınmalıdır.
    - Soğutucu söküldüyse termal macun yenilenmeli, vidalar tork sırasına göre sıkılmalıdır.
    - Emin olunmayan bir adımda işleme devam edilmemeli, deneyimli birinden destek alınmalıdır.
de:
  brand: Victus 16 Hall-Sensor-Anleitung
  description: Diagnose und Reparatur des Hall-Sensor- und FU6-Sicherungsfehlers bei HP Victus 16 Laptops (Toshiba TCS40DLR LA8 durch Allegro A1126 ersetzt).
  skip: Zum Inhalt springen
  contents: Inhalt
  language: Sprache
  theme: Helles/dunkles Design umschalten
  repo: GitHub-Repository
  preview: Bildvorschau
  close: Schließen
  figure: Abbildung
  anchor: Link zu diesem Abschnitt
  zoom: Zum Vergrößern klicken
  read_guide: Anleitung lesen
  other_langs: Weitere Sprachen
  support:
    title: Hat es geholfen?
    text: Wenn dir die Anleitung geholfen hat, hilft ein Stern auf GitHub anderen Victus-Besitzern, sie zu finden.
    cta: Stern auf GitHub vergeben
  summary:
    title: Auf einen Blick
    symptom_k: Symptom
    symptom: Bildschirm- und Tastaturbeleuchtung gehen zufällig aus oder flackern, vor allem unter hoher thermischer Last; das System verhält sich, als wäre der Deckel geschlossen.
    cause_k: Ursache
    cause: Die Sicherung FU6 in der 3,3-V-Versorgung des Hall-Sensors altert durch Hitze und ihr Widerstand steigt; der originale Toshiba TCS40DLR (LA8) ist außerdem nur bis 85 °C spezifiziert.
    fix_k: Lösung
    fix: Den Sensor durch einen Allegro A1126 ersetzen und FU6 überbrücken (oder eine neue Sicherung einsetzen). Nur eines von beiden reicht nicht aus.
    level_k: Niveau
    level: 'Fortgeschritten: SMD-Löten, Schaltplanlesen und Messungen mit dem Multimeter. Hauptplatine und Kühlkörper müssen ausgebaut werden.'
  diagram:
    title: Versorgungspfad des Hall-Sensors
    mb: Hauptplatine
    sb: Sensorplatine
    rail: 3V3-Schiene
    cable: FFC-Kabel
    sensor: Hall-Sensor
    ec: EC
    out: Ausgang (FFC)
    light: Bildschirm- und Tastaturbeleuchtung
    caption: FU6 liegt in Reihe mit der Versorgung des Sensors; jeder zusätzliche Widerstand senkt die Spannung, bevor sie den Sensor erreicht. Vereinfachte Darstellung auf Blockebene; der Sensorausgang kann auf der Hauptplatine Zwischenschaltungen durchlaufen, bevor er den EC erreicht.
  variant:
    title: FU6 auf Ihrer Platine nicht gefunden?
    p1: Diese Anleitung basiert auf meiner eigenen Hauptplatine, auf der die Sicherung als FU6 bezeichnet ist und direkt neben der Buchse JIR1 sitzt. Auf anderen Platinenvarianten (zum Beispiel mit Intel-Prozessor) befindet sich die entsprechende Sicherung wahrscheinlich auf der Rückseite der Hauptplatine und trägt die Bezeichnung FN2; das stammt aus Forenfällen und ist nicht sicher. Um die Sicherung zu finden, verfolgt man die 3,3-V-Leitung des Hall-Sensors von der Buchse JIR1 aus zurück.
    p2: 'Für eine sichere Diagnose, ob die Sicherung intakt ist, sollten beide Messungen durchgeführt werden:'
    items:
    - Bei stromloser Platine muss die Sicherung zwischen ihren beiden Enden die Durchgangsprüfung bestehen (der Summer muss ertönen). Bleibt der Summer still und zeigt das Multimeter einen Widerstandswert, ist die Sicherung degradiert.
    - Bei eingeschalteter Platine darf zwischen den beiden Enden der Sicherung kein nennenswerter Spannungsabfall auftreten; bei einer intakten Sicherung ist er praktisch null und liegt höchstens bei wenigen mV. An meiner defekten FU6 habe ich 30 mV gemessen.
    p3: 'Bei Messungen unter Spannung vorsichtig sein: Eine abrutschende Messspitze kann benachbarte Pins kurzschließen und die Hardware beschädigen. Zuerst bei stromloser Platine per Durchgangsprüfung ermitteln, welcher Pin 3V3 führen muss.'
  checklist:
    title: Nach der Reparatur
    items:
    - Alle Lötstellen per Durchgangsprüfung kontrollieren.
    - Bei stromloser Platine per Durchgangsprüfung ermitteln, welcher Pin von JIR1 3V3 führen muss; danach bei eingeschalteter Platine vorsichtig 3,3 V an diesem Pin messen.
    - Den Kühlkörper mit neuer Wärmeleitpaste montieren und die Schrauben in der vorgegebenen Reihenfolge anziehen.
    - Tastaturbeleuchtung einschalten und den Deckel einige Male öffnen und schließen; Bildschirm und Beleuchtung müssen dem Deckel korrekt folgen.
    - Einen längeren thermischen Belastungstest durchführen und auf Flackern oder Aussetzer der Beleuchtung achten.
  disclaimer:
    title: 'Vor dem Start: Haftungsausschluss'
    p1: Ich bin kein Reparaturtechniker, sondern Student der Elektrotechnik und Elektronik. Der Inhalt dieser Anleitung beruht auf Informationen, die ich im Internet zusammengetragen habe, auf meiner Auslegung der Datenblätter, auf eigenen Schlussfolgerungen sowie auf den Arbeiten und Messungen, die ich selbst an meinem eigenen Gerät durchgeführt habe; es gibt keine Garantie, dass sie bei jedem Gerät zum gleichen Ergebnis führt.
    p2: 'Alle Messungen und Arbeiten in dieser Anleitung erfolgen vollständig auf eigene Verantwortung. Achten Sie besonders auf Folgendes:'
    items:
    - Vor dem Löten oder Zerlegen das Netzteil abziehen, sicherstellen, dass das Gerät stromlos ist, und den Akkustecker lösen.
    - Bei Messungen unter Spannung kann eine abrutschende Messspitze benachbarte Pins kurzschließen und die Hardware beschädigen; feine Messspitzen verwenden und sie ruhig auf den Pads halten.
    - Bei Heißluft die kleinen Kondensatoren neben dem Sensor und Buchsen wie JIR2 mit Kapton-Band schützen.
    - Bei der Arbeit an der Platine Maßnahmen gegen elektrostatische Entladung (ESD) treffen.
    - Wurde der Kühlkörper abgenommen, die Wärmeleitpaste erneuern und die Schrauben in der vorgegebenen Reihenfolge anziehen.
    - Bei Unsicherheit in einem Schritt nicht weitermachen und Hilfe von einer erfahrenen Person holen.
fr:
  brand: Guide capteur Hall Victus 16
  description: Diagnostic et réparation de la panne du capteur à effet Hall et du fusible FU6 sur les ordinateurs portables HP Victus 16 (Toshiba TCS40DLR LA8 remplacé par un Allegro A1126).
  skip: Aller au contenu
  contents: Sommaire
  language: Langue
  theme: Basculer entre thème clair et sombre
  repo: Dépôt GitHub
  preview: Aperçu de l'image
  close: Fermer
  figure: Figure
  anchor: Lien vers cette section
  zoom: Cliquer pour agrandir
  read_guide: Lire le guide
  other_langs: Autres langues
  support:
    title: Ce guide vous a aidé ?
    text: Si ce guide vous a aidé à réparer votre ordinateur, une étoile sur GitHub aide d'autres propriétaires de Victus à le trouver.
    cta: Mettre une étoile sur GitHub
  summary:
    title: En bref
    symptom_k: Symptôme
    symptom: Le rétroéclairage de l'écran et du clavier s'éteint ou scintille au hasard, surtout sous forte charge thermique ; le système se comporte comme si l'écran était rabattu.
    cause_k: Cause
    cause: Le fusible FU6 sur l'alimentation 3,3 V du capteur Hall se dégrade avec la chaleur et sa résistance augmente ; le capteur Toshiba TCS40DLR (LA8) d'origine n'est de plus spécifié que jusqu'à 85 °C.
    fix_k: Solution
    fix: Remplacer le capteur par un Allegro A1126 et ponter FU6 (ou poser un fusible neuf). Une seule des deux opérations ne suffit pas.
    level_k: Niveau
    level: 'Avancé : soudure CMS, lecture de schémas et mesures au multimètre. La carte mère et le dissipateur doivent être démontés.'
  diagram:
    title: Chemin d'alimentation du capteur Hall
    mb: Carte mère
    sb: Carte capteur
    rail: Rail 3V3
    cable: Nappe FFC
    sensor: Capteur Hall
    ec: EC
    out: Sortie (FFC)
    light: Rétroéclairage écran et clavier
    caption: FU6 est en série avec l'alimentation du capteur ; toute résistance qu'il gagne fait chuter la tension avant qu'elle n'atteigne le capteur. Il s'agit d'une vue simplifiée au niveau des blocs ; la sortie du capteur peut traverser des circuits intermédiaires sur la carte mère avant d'atteindre l'EC.
  variant:
    title: Vous ne trouvez pas FU6 sur votre carte ?
    p1: Ce guide s'appuie sur ma propre carte mère, où le fusible est repéré FU6 et se trouve juste à côté du connecteur JIR1. Sur d'autres variantes de carte (par exemple celles à processeur Intel), le fusible équivalent se trouve probablement sur la face arrière de la carte mère, repéré FN2 ; cela provient de cas rapportés sur des forums et n'est pas certain. Pour trouver le fusible, suivez la ligne 3,3 V du capteur Hall en remontant depuis le connecteur JIR1.
    p2: 'Pour un diagnostic certain de l''état du fusible, les deux mesures suivantes doivent être faites :'
    items:
    - Carte hors tension, le fusible doit passer le test de continuité entre ses deux extrémités (le buzzer doit sonner). Si le buzzer reste muet et que le multimètre affiche une valeur de résistance, le fusible est dégradé.
    - Carte sous tension, il ne doit y avoir aucune chute de tension notable entre les deux extrémités du fusible ; sur un fusible sain, elle est pratiquement nulle et ne dépasse pas quelques mV. Sur mon FU6 défectueux, j'ai mesuré 30 mV.
    p3: 'Soyez prudent lors des mesures sous tension : une pointe de touche qui glisse peut court-circuiter des broches voisines et endommager le matériel. Déterminez d''abord, carte hors tension, par un test de continuité, quelle broche doit porter le 3V3.'
  checklist:
    title: Après la réparation
    items:
    - Vérifier chaque soudure par un test de continuité.
    - Carte hors tension, repérer par continuité la broche de JIR1 qui doit porter le 3V3 ; puis, carte sous tension, mesurer prudemment 3,3 V sur cette broche.
    - Remonter le dissipateur avec de la pâte thermique neuve et serrer les vis dans l'ordre indiqué.
    - Allumer le rétroéclairage du clavier et ouvrir et fermer l'écran plusieurs fois ; l'écran et le rétroéclairage doivent suivre correctement la position de l'écran.
    - Lancer un long test de charge thermique et surveiller tout scintillement ou toute coupure du rétroéclairage.
  disclaimer:
    title: 'Avant de commencer : avertissement'
    p1: Je ne suis pas réparateur, je suis étudiant en génie électrique et électronique. Le contenu de ce guide repose sur des informations que j'ai compilées sur Internet, sur ma lecture des fiches techniques, sur mes propres déductions et sur les opérations et mesures que j'ai réalisées moi-même sur mon propre appareil ; rien ne garantit qu'il donnera le même résultat sur tous les appareils.
    p2: 'Toutes les mesures et opérations de ce guide se font entièrement sous votre propre responsabilité. Faites particulièrement attention aux points suivants :'
    items:
    - Avant toute soudure ou tout démontage, débranchez le chargeur, assurez-vous que l'appareil est hors tension et débranchez le connecteur de la batterie.
    - Lors des mesures sous tension, une pointe de touche qui glisse peut court-circuiter des broches voisines et endommager le matériel ; utilisez des pointes fines et maintenez-les bien immobiles sur les pastilles.
    - Avec de l'air chaud, protégez au ruban Kapton les petits condensateurs proches du capteur et les connecteurs comme JIR2.
    - Prenez des précautions contre les décharges électrostatiques (ESD) lorsque vous travaillez sur la carte.
    - Si le dissipateur a été démonté, renouvelez la pâte thermique et serrez les vis dans l'ordre indiqué.
    - En cas de doute sur une étape, arrêtez-vous et demandez l'aide d'une personne expérimentée.
es:
  brand: Guía del sensor Hall Victus 16
  description: Diagnóstico y reparación de la avería del sensor de efecto Hall y del fusible FU6 en portátiles HP Victus 16 (Toshiba TCS40DLR LA8 sustituido por Allegro A1126).
  skip: Ir al contenido
  contents: Contenido
  language: Idioma
  theme: Cambiar entre tema claro y oscuro
  repo: Repositorio de GitHub
  preview: Vista previa de la imagen
  close: Cerrar
  figure: Figura
  anchor: Enlace a esta sección
  zoom: Haz clic para ampliar
  read_guide: Leer la guía
  other_langs: Otros idiomas
  support:
    title: ¿Te ha servido?
    text: Si la guía te ha ayudado a reparar tu portátil, una estrella en GitHub ayuda a que otros usuarios de Victus la encuentren.
    cta: Dar una estrella en GitHub
  summary:
    title: En resumen
    symptom_k: Síntoma
    symptom: La retroiluminación de la pantalla y del teclado se apaga o parpadea al azar, sobre todo con carga térmica alta; el sistema se comporta como si la tapa estuviera cerrada.
    cause_k: Causa
    cause: El fusible FU6 de la alimentación de 3,3 V del sensor Hall se degrada con el calor y su resistencia aumenta; además, el sensor Toshiba TCS40DLR (LA8) original solo está especificado hasta 85 °C.
    fix_k: Solución
    fix: Sustituir el sensor por un Allegro A1126 y puentear FU6 (o montar un fusible nuevo). Hacer solo una de las dos cosas no es suficiente.
    level_k: Nivel
    level: 'Avanzado: soldadura SMD, lectura de esquemas y medidas con multímetro. Hay que desmontar la placa base y el disipador.'
  diagram:
    title: Ruta de alimentación del sensor Hall
    mb: Placa base
    sb: Placa del sensor
    rail: Línea de 3V3
    cable: Cable FFC
    sensor: Sensor Hall
    ec: EC
    out: Salida (FFC)
    light: Retroiluminación de pantalla y teclado
    caption: FU6 está en serie con la alimentación del sensor, así que cualquier resistencia que gane reduce la tensión antes de que llegue al sensor. Es una representación simplificada a nivel de bloques; la salida del sensor puede pasar por circuitos intermedios de la placa base antes de llegar al EC.
  variant:
    title: ¿No encuentras FU6 en tu placa?
    p1: Esta guía se basa en mi propia placa base, donde el fusible está marcado como FU6 y se encuentra justo al lado del conector JIR1. En otras variantes de placa (por ejemplo, las de procesador Intel) es probable que el fusible equivalente esté en la cara trasera de la placa base, marcado como FN2; esto proviene de casos en foros y no es seguro. Para localizar el fusible, sigue la línea de 3,3 V del sensor Hall hacia atrás desde el conector JIR1.
    p2: 'Para un diagnóstico seguro del estado del fusible, deben hacerse estas dos medidas:'
    items:
    - Con la placa sin alimentación, el fusible debe pasar la prueba de continuidad entre sus dos extremos (el zumbador debe sonar). Si el zumbador no suena y el multímetro muestra un valor de resistencia, el fusible se ha degradado.
    - Con la placa alimentada, no debe haber una caída de tensión apreciable entre los dos extremos del fusible; en un fusible sano esta caída es prácticamente nula y no supera unos pocos mV. En mi FU6 dañado medí 30 mV.
    p3: 'Ten cuidado al medir con la placa alimentada: si la punta de la sonda resbala, puede cortocircuitar pines vecinos y dañar el hardware. Determina primero, con la placa sin alimentación y una prueba de continuidad, qué pin debe llevar los 3V3.'
  checklist:
    title: Después de la reparación
    items:
    - Comprobar todas las soldaduras con una prueba de continuidad.
    - Con la placa sin alimentación, localizar por continuidad qué pin de JIR1 debe llevar 3V3; después, con la placa alimentada, medir con cuidado 3,3 V en ese pin.
    - Volver a montar el disipador con pasta térmica nueva y apretar los tornillos en el orden indicado.
    - Encender la retroiluminación del teclado y abrir y cerrar la tapa varias veces; la pantalla y la retroiluminación deben responder correctamente a la tapa.
    - Hacer una prueba de estrés térmico prolongada y vigilar si hay parpadeos o cortes de la retroiluminación.
  disclaimer:
    title: 'Antes de empezar: aviso de responsabilidad'
    p1: No soy técnico de reparación, soy estudiante de ingeniería eléctrica y electrónica. Lo que se explica en esta guía se basa en información que he recopilado en internet, en mi interpretación de las hojas de datos, en mis propias conclusiones y en los trabajos y medidas que he realizado personalmente en mi propio equipo; no hay garantía de que dé el mismo resultado en todos los equipos.
    p2: 'Todas las medidas y operaciones de esta guía se realizan bajo tu propia responsabilidad. Presta especial atención a lo siguiente:'
    items:
    - Antes de soldar o desmontar, desconecta el cargador, asegúrate de que el equipo no tenga alimentación y desconecta el conector de la batería.
    - En las medidas con el equipo alimentado, si la punta de la sonda resbala puede cortocircuitar pines vecinos y dañar el hardware; usa puntas finas y mantenlas firmes sobre las almohadillas.
    - Al usar aire caliente, protege con cinta Kapton los pequeños condensadores cercanos al sensor y conectores como JIR2.
    - Toma precauciones contra la descarga electrostática (ESD) al trabajar en la placa.
    - Si has desmontado el disipador, renueva la pasta térmica y aprieta los tornillos en el orden indicado.
    - Si no estás seguro de algún paso, detente y pide ayuda a alguien con experiencia.
id:
  brand: Panduan sensor Hall Victus 16
  description: Diagnosis dan perbaikan kerusakan sensor efek Hall dan sekring FU6 pada laptop HP Victus 16 (Toshiba TCS40DLR LA8 diganti dengan Allegro A1126).
  skip: Langsung ke isi
  contents: Daftar isi
  language: Bahasa
  theme: Ganti tema terang/gelap
  repo: Repositori GitHub
  preview: Pratinjau gambar
  close: Tutup
  figure: Gambar
  anchor: Tautan ke bagian ini
  zoom: Klik untuk memperbesar
  read_guide: Baca panduan
  other_langs: Bahasa lain
  support:
    title: Apakah panduan ini membantu?
    text: Jika panduan ini membantu memperbaiki laptop Anda, beri bintang di GitHub agar pemilik Victus lain lebih mudah menemukannya.
    cta: Beri bintang di GitHub
  summary:
    title: Ringkasan
    symptom_k: Gejala
    symptom: Lampu latar layar dan keyboard mati atau berkedip secara acak, terutama saat beban panas tinggi; sistem berperilaku seolah-olah layar laptop sedang ditutup.
    cause_k: Penyebab
    cause: Sekring FU6 pada jalur suplai 3,3 V sensor Hall menurun kualitasnya akibat panas dan resistansinya naik; sensor Toshiba TCS40DLR (LA8) bawaan juga hanya dirancang hingga 85 °C.
    fix_k: Solusi
    fix: Ganti sensor dengan Allegro A1126 dan bypass FU6 (atau pasang sekring baru). Melakukan salah satunya saja tidak cukup.
    level_k: Tingkat
    level: 'Lanjutan: menyolder SMD, membaca skematik, dan pengukuran dengan multimeter. Motherboard dan heatsink harus dilepas.'
  diagram:
    title: Jalur suplai sensor Hall
    mb: Motherboard
    sb: Papan sensor
    rail: Jalur 3V3
    cable: Kabel FFC
    sensor: Sensor Hall
    ec: EC
    out: Keluaran (FFC)
    light: Lampu latar layar dan keyboard
    caption: FU6 terpasang seri dengan suplai sensor, sehingga setiap kenaikan resistansinya menurunkan tegangan sebelum sampai ke sensor. Ini adalah gambaran sederhana di tingkat blok; keluaran sensor dapat melewati rangkaian perantara di motherboard sebelum sampai ke EC.
  variant:
    title: Tidak menemukan FU6 di papan Anda?
    p1: Panduan ini dibuat berdasarkan motherboard milik saya sendiri, di mana sekringnya berlabel FU6 dan terletak tepat di sebelah soket JIR1. Pada varian papan lain (misalnya yang berprosesor Intel) sekring yang setara kemungkinan berada di sisi belakang motherboard dengan label FN2; informasi ini berasal dari kasus di forum dan belum pasti. Untuk menemukan sekring, telusuri jalur 3,3 V sensor Hall ke belakang mulai dari soket JIR1.
    p2: 'Untuk diagnosis pasti apakah sekring masih baik, kedua pengukuran berikut harus dilakukan:'
    items:
    - Saat papan tidak bertegangan, sekring harus lolos uji kontinuitas di antara kedua ujungnya (buzzer harus berbunyi). Jika buzzer tidak berbunyi dan multimeter menunjukkan nilai resistansi, sekring telah rusak.
    - Saat papan bertegangan, tidak boleh ada penurunan tegangan yang berarti di antara kedua ujung sekring; pada sekring yang baik penurunan ini praktis nol dan tidak lebih dari beberapa mV. Pada FU6 saya yang rusak, saya mengukur 30 mV.
    p3: 'Berhati-hatilah saat mengukur dalam keadaan bertegangan: ujung probe yang tergelincir dapat menghubungsingkatkan pin di sebelahnya dan merusak perangkat keras. Tentukan terlebih dahulu dengan uji kontinuitas saat papan tidak bertegangan, pin mana yang harus membawa 3V3.'
  checklist:
    title: Setelah perbaikan
    items:
    - Periksa semua sambungan solder dengan uji kontinuitas.
    - Saat papan tidak bertegangan, tentukan dengan uji kontinuitas pin JIR1 mana yang harus membawa 3V3; lalu ukur 3,3 V pada pin tersebut dengan hati-hati saat papan bertegangan.
    - Pasang kembali heatsink dengan pasta termal baru dan kencangkan sekrup sesuai urutannya.
    - Nyalakan lampu latar keyboard lalu buka dan tutup layar beberapa kali; layar dan lampu latar harus mengikuti posisi layar dengan benar.
    - Jalankan uji stres termal dalam waktu lama dan perhatikan apakah ada kedipan atau lampu latar yang mati.
  disclaimer:
    title: 'Sebelum mulai: penafian'
    p1: Saya bukan teknisi reparasi, saya mahasiswa teknik elektro dan elektronika. Isi panduan ini didasarkan pada informasi yang saya kumpulkan dari internet, interpretasi saya terhadap datasheet, kesimpulan saya sendiri, serta pekerjaan dan pengukuran yang saya lakukan sendiri pada perangkat saya; tidak ada jaminan hasilnya akan sama pada setiap perangkat.
    p2: 'Semua pengukuran dan pekerjaan dalam panduan ini sepenuhnya menjadi tanggung jawab Anda sendiri. Perhatikan terutama hal-hal berikut:'
    items:
    - Sebelum menyolder atau membongkar, cabut charger, pastikan perangkat tidak bertegangan, dan lepaskan konektor baterai.
    - Saat pengukuran bertegangan, ujung probe yang tergelincir dapat menghubungsingkatkan pin di sebelahnya dan merusak perangkat keras; gunakan probe berujung runcing dan tahan dengan stabil di atas pad.
    - Saat menggunakan udara panas, lindungi kapasitor kecil di dekat sensor dan soket seperti JIR2 dengan selotip Kapton.
    - Lakukan tindakan pencegahan terhadap pelepasan muatan listrik statis (ESD) saat bekerja pada papan.
    - Jika heatsink sudah dilepas, ganti pasta termal dan kencangkan sekrup sesuai urutannya.
    - Jika ragu pada suatu langkah, berhentilah dan minta bantuan orang yang berpengalaman.
it:
  brand: Guida sensore Hall Victus 16
  description: Diagnosi e riparazione del guasto del sensore a effetto Hall e del fusibile FU6 nei portatili HP Victus 16 (da Toshiba TCS40DLR LA8 ad Allegro A1126).
  skip: Vai al contenuto
  contents: Indice
  language: Lingua
  theme: Cambia tema chiaro/scuro
  repo: Repository GitHub
  preview: Anteprima immagine
  close: Chiudi
  figure: Figura
  anchor: Link a questa sezione
  zoom: Clicca per ingrandire
  read_guide: Leggi la guida
  other_langs: Altre lingue
  summary:
    title: In breve
    symptom_k: Sintomo
    symptom: Lo schermo e la retroilluminazione della tastiera si spengono o sfarfallano a caso, soprattutto sotto carico termico elevato; il sistema si comporta come se il coperchio fosse chiuso.
    cause_k: Causa
    cause: Il fusibile FU6 sull'alimentazione a 3,3 V del sensore Hall si degrada con il calore e la sua resistenza aumenta; inoltre il sensore originale Toshiba TCS40DLR (LA8) è specificato solo fino a 85 °C.
    fix_k: Soluzione
    fix: Sostituire il sensore con un Allegro A1126 e bypassare FU6 (oppure montare un nuovo fusibile). Fare solo una delle due cose non basta.
    level_k: Livello
    level: 'Avanzato: saldatura SMD, lettura di schemi e misure con il multimetro. Bisogna smontare la scheda madre e il dissipatore.'
  diagram:
    title: Percorso di alimentazione del sensore Hall
    mb: Scheda madre
    sb: Scheda sensore
    rail: Linea 3V3
    cable: Cavo FFC
    sensor: Sensore Hall
    ec: EC
    out: Uscita (FFC)
    light: Schermo e retroilluminazione tastiera
    caption: FU6 è in serie con l'alimentazione del sensore, quindi qualsiasi resistenza acquisita provoca una caduta di tensione prima che arrivi al sensore. È una vista semplificata a blocchi; l'uscita del sensore può attraversare altri circuiti sulla scheda madre prima di raggiungere l'EC.
  variant:
    title: Non trovi FU6 sulla tua scheda?
    p1: Questa guida si basa sulla mia scheda madre, dove il fusibile è siglato FU6 e si trova subito accanto al connettore JIR1. Su altre varianti (ad esempio quelle basate su Intel) il fusibile equivalente si trova probabilmente sul lato posteriore della scheda madre, siglato FN2; questa informazione viene da casi sui forum e non è certa. Per individuare il fusibile, segui a ritroso la linea 3,3 V del sensore Hall partendo dal connettore JIR1.
    p2: 'Per una diagnosi certa dello stato del fusibile vanno fatte entrambe queste misure:'
    items:
    - A scheda non alimentata, il fusibile deve superare il test di continuità tra i due capi (il cicalino deve suonare). Se il cicalino resta muto e il multimetro mostra un valore di resistenza, il fusibile è degradato.
    - A scheda alimentata, tra i due capi del fusibile non deve esserci una caduta di tensione apprezzabile; su un fusibile sano è praticamente zero e non supera pochi mV. Sul mio FU6 guasto ho misurato 30 mV.
    p3: 'Attenzione nelle misure sotto tensione: una punta che scivola può cortocircuitare i pin vicini e danneggiare l''hardware. Prima stabilisci con il test di continuità, a scheda non alimentata, quale pin deve portare i 3V3.'
  checklist:
    title: Dopo la riparazione
    items:
    - Controlla ogni giunto di saldatura con il test di continuità.
    - A scheda spenta, individua con il test di continuità quale pin di JIR1 deve portare i 3V3; poi, a scheda alimentata, misura con attenzione 3,3 V su quel pin.
    - Rimonta il dissipatore con pasta termica nuova e stringi le viti nell'ordine indicato.
    - Accendi la retroilluminazione della tastiera e apri e chiudi il coperchio alcune volte; schermo e retroilluminazione devono seguire correttamente il coperchio.
    - Esegui un lungo stress test termico e controlla che non ci siano sfarfallii o spegnimenti della retroilluminazione.
  disclaimer:
    title: 'Prima di iniziare: avvertenze'
    p1: Non sono un tecnico riparatore; sono uno studente di ingegneria elettrica ed elettronica. Ciò che questa guida descrive si basa su informazioni raccolte in rete, sulla mia lettura dei datasheet, sulle mie conclusioni e sul lavoro e sulle misure che ho eseguito personalmente sul mio dispositivo; non c'è alcuna garanzia che dia lo stesso risultato su ogni dispositivo.
    p2: 'Tutte le misure e gli interventi descritti sono interamente sotto la tua responsabilità. Presta particolare attenzione a quanto segue:'
    items:
    - Prima di saldare o smontare, scollega il caricabatterie, assicurati che il dispositivo non sia alimentato e scollega il connettore della batteria.
    - Durante le misure sotto tensione una punta che scivola può cortocircuitare i pin vicini e danneggiare l'hardware; usa puntali sottili e tienili fermi sulle piazzole.
    - Se usi l'aria calda, proteggi con nastro kapton i piccoli condensatori vicino al sensore e i connettori come JIR2.
    - Prendi precauzioni contro le scariche elettrostatiche (ESD) mentre lavori sulla scheda.
    - Se hai smontato il dissipatore, rinnova la pasta termica e stringi le viti nell'ordine indicato.
    - Se non sei sicuro di un passaggio, fermati e fatti aiutare da qualcuno con esperienza.
  support:
    title: Ti è stata utile?
    text: Se la guida ti ha aiutato a riparare il portatile, una stella su GitHub aiuta altri possessori di Victus a trovarla.
    cta: Metti una stella su GitHub
pl:
  brand: Poradnik czujnika Halla Victus 16
  description: Diagnoza i naprawa awarii czujnika Halla oraz bezpiecznika FU6 w laptopach HP Victus 16 (Toshiba TCS40DLR LA8 zamieniony na Allegro A1126).
  skip: Przejdź do treści
  contents: Spis treści
  language: Język
  theme: Przełącz jasny/ciemny motyw
  repo: Repozytorium GitHub
  preview: Podgląd obrazu
  close: Zamknij
  figure: Rysunek
  anchor: Link do tej sekcji
  zoom: Kliknij, aby powiększyć
  read_guide: Czytaj poradnik
  other_langs: Inne języki
  summary:
    title: W skrócie
    symptom_k: Objaw
    symptom: Ekran i podświetlenie klawiatury losowo gasną lub migoczą, głównie przy dużym obciążeniu termicznym; system zachowuje się tak, jakby pokrywa była zamknięta.
    cause_k: Przyczyna
    cause: Bezpiecznik FU6 na zasilaniu 3,3 V czujnika Halla degraduje się pod wpływem temperatury i rośnie jego rezystancja; dodatkowo oryginalny czujnik Toshiba TCS40DLR (LA8) jest przewidziany tylko do 85 °C.
    fix_k: Naprawa
    fix: Wymienić czujnik na Allegro A1126 i zmostkować FU6 (albo wlutować nowy bezpiecznik). Wykonanie tylko jednej z tych czynności nie wystarczy.
    level_k: Poziom
    level: 'Zaawansowany: lutowanie SMD, czytanie schematów i pomiary multimetrem. Trzeba wyjąć płytę główną i zdjąć radiator.'
  diagram:
    title: Ścieżka zasilania czujnika Halla
    mb: Płyta główna
    sb: Płytka czujnika
    rail: Linia 3V3
    cable: Taśma FFC
    sensor: Czujnik Halla
    ec: EC
    out: Wyjście (FFC)
    light: Ekran i podświetlenie klawiatury
    caption: FU6 jest połączony szeregowo z zasilaniem czujnika, więc każda rezystancja, którą nabierze, powoduje spadek napięcia, zanim dotrze ono do czujnika. To uproszczony schemat blokowy; wyjście czujnika może przechodzić przez dodatkowe obwody na płycie głównej, zanim trafi do EC.
  variant:
    title: Nie możesz znaleźć FU6 na swojej płycie?
    p1: Ten poradnik opiera się na mojej płycie głównej, na której bezpiecznik jest oznaczony jako FU6 i znajduje się tuż obok złącza JIR1. Na innych wariantach płyt (na przykład z procesorami Intel) odpowiedni bezpiecznik prawdopodobnie znajduje się na spodzie płyty głównej i jest oznaczony FN2; ta informacja pochodzi z przypadków opisanych na forach i nie jest pewna. Aby znaleźć bezpiecznik, prześledź linię 3,3 V czujnika Halla wstecz od złącza JIR1.
    p2: 'Aby jednoznacznie ocenić stan bezpiecznika, należy wykonać oba poniższe pomiary:'
    items:
    - Przy odłączonym zasilaniu bezpiecznik musi przejść test ciągłości między swoimi końcami (brzęczyk musi zadziałać). Jeśli brzęczyk milczy, a multimetr pokazuje wartość rezystancji, bezpiecznik jest zdegradowany.
    - Przy włączonym zasilaniu między końcami bezpiecznika nie może być zauważalnego spadku napięcia; na sprawnym bezpieczniku jest on praktycznie zerowy i nie przekracza kilku mV. Na moim uszkodzonym FU6 zmierzyłem 30 mV.
    p3: 'Uważaj przy pomiarach pod napięciem: ześlizgująca się sonda może zewrzeć sąsiednie piny i uszkodzić sprzęt. Najpierw, przy odłączonym zasilaniu, ustal testem ciągłości, który pin musi przenosić 3V3.'
  checklist:
    title: Po naprawie
    items:
    - Sprawdź każdy lut testem ciągłości.
    - Przy wyłączonej płycie ustal testem ciągłości, który pin JIR1 musi przenosić 3V3; następnie przy włączonej płycie ostrożnie zmierz na nim 3,3 V.
    - Załóż radiator ze świeżą pastą termoprzewodzącą i dokręć śruby w podanej kolejności.
    - Włącz podświetlenie klawiatury i kilka razy otwórz i zamknij pokrywę; ekran i podświetlenie powinny poprawnie reagować na pokrywę.
    - Uruchom długi test obciążeniowy i obserwuj, czy nie pojawia się migotanie lub gaśnięcie podświetlenia.
  disclaimer:
    title: 'Zanim zaczniesz: zastrzeżenie'
    p1: Nie jestem serwisantem; jestem studentem elektrotechniki i elektroniki. Opisane tu informacje opierają się na tym, co zebrałem w internecie, na mojej lekturze kart katalogowych, na moich wnioskach oraz na pracach i pomiarach wykonanych osobiście na moim urządzeniu; nie ma gwarancji, że na każdym urządzeniu dadzą ten sam rezultat.
    p2: 'Wszystkie pomiary i czynności opisane w poradniku wykonujesz na własną odpowiedzialność. Zwróć szczególną uwagę na poniższe punkty:'
    items:
    - Przed lutowaniem lub demontażem odłącz ładowarkę, upewnij się, że urządzenie nie jest zasilane, i odłącz złącze baterii.
    - Podczas pomiarów pod napięciem ześlizgująca się sonda może zewrzeć sąsiednie piny i uszkodzić sprzęt; używaj cienkich sond i trzymaj je stabilnie na padach.
    - Używając gorącego powietrza, zabezpiecz taśmą kapton małe kondensatory obok czujnika oraz złącza takie jak JIR2.
    - Podczas pracy przy płycie stosuj ochronę przed wyładowaniami elektrostatycznymi (ESD).
    - Jeśli zdejmowałeś radiator, wymień pastę termoprzewodzącą i dokręć śruby w podanej kolejności.
    - Jeśli nie masz pewności co do któregoś kroku, przerwij i poproś o pomoc kogoś doświadczonego.
  support:
    title: Czy to pomogło?
    text: Jeśli poradnik pomógł Ci naprawić laptopa, gwiazdka na GitHubie pomoże innym właścicielom Victusa go znaleźć.
    cta: Daj gwiazdkę na GitHubie
ru:
  brand: Руководство по датчику Холла Victus 16
  description: Диагностика и ремонт неисправности датчика Холла и предохранителя FU6 в ноутбуках HP Victus 16 (замена Toshiba TCS40DLR LA8 на Allegro A1126).
  skip: Перейти к содержимому
  contents: Содержание
  language: Язык
  theme: Переключить светлую/тёмную тему
  repo: Репозиторий на GitHub
  preview: Просмотр изображения
  close: Закрыть
  figure: Рисунок
  anchor: Ссылка на этот раздел
  zoom: Нажмите, чтобы увеличить
  read_guide: Читать руководство
  other_langs: Другие языки
  summary:
    title: Кратко
    symptom_k: Симптом
    symptom: Экран и подсветка клавиатуры случайным образом гаснут или мерцают, в основном при высокой тепловой нагрузке; система ведёт себя так, будто крышка закрыта.
    cause_k: Причина
    cause: Предохранитель FU6 в цепи питания 3,3 В датчика Холла деградирует от нагрева, и его сопротивление растёт; кроме того, штатный датчик Toshiba TCS40DLR (LA8) рассчитан только до 85 °C.
    fix_k: Решение
    fix: Заменить датчик на Allegro A1126 и закоротить FU6 (или установить новый предохранитель). Выполнить только одно из двух недостаточно.
    level_k: Уровень
    level: 'Продвинутый: пайка SMD, чтение схем и измерения мультиметром. Нужно снять материнскую плату и радиатор.'
  diagram:
    title: Цепь питания датчика Холла
    mb: Материнская плата
    sb: Плата датчика
    rail: Линия 3V3
    cable: Шлейф FFC
    sensor: Датчик Холла
    ec: EC
    out: Выход (FFC)
    light: Экран и подсветка клавиатуры
    caption: FU6 включён последовательно в цепь питания датчика, поэтому любое сопротивление, которое он приобретает, создаёт падение напряжения ещё до датчика. Это упрощённая блок-схема; выход датчика может проходить через промежуточные цепи на материнской плате, прежде чем попасть в EC.
  variant:
    title: Не можете найти FU6 на своей плате?
    p1: Руководство основано на моей материнской плате, где предохранитель обозначен FU6 и находится рядом с разъёмом JIR1. На других вариантах плат (например, на платах с Intel) аналогичный предохранитель, вероятно, расположен на обратной стороне материнской платы и обозначен FN2; это основано на случаях с форумов и не является достоверным. Чтобы найти предохранитель, проследите линию 3,3 В датчика Холла от разъёма JIR1.
    p2: 'Для однозначной диагностики состояния предохранителя нужно выполнить оба измерения:'
    items:
    - На обесточенной плате предохранитель должен проходить прозвонку между выводами (зуммер должен пищать). Если зуммер молчит, а мультиметр показывает сопротивление, предохранитель деградировал.
    - На плате под напряжением между выводами предохранителя не должно быть заметного падения напряжения; на исправном предохранителе оно практически нулевое и не превышает нескольких мВ. На моём неисправном FU6 я намерил 30 мВ.
    p3: 'Будьте осторожны при измерениях под напряжением: соскользнувший щуп может замкнуть соседние выводы и повредить оборудование. Сначала на обесточенной плате прозвонкой определите, на каком выводе должно быть 3V3.'
  checklist:
    title: После ремонта
    items:
    - Проверьте каждую пайку прозвонкой.
    - На выключенной плате прозвонкой определите, на каком выводе JIR1 должно быть 3V3; затем на включённой плате аккуратно измерьте на нём 3,3 В.
    - Установите радиатор на свежую термопасту и затяните винты в указанном порядке.
    - Включите подсветку клавиатуры и несколько раз откройте и закройте крышку; экран и подсветка должны правильно реагировать на крышку.
    - Запустите длительный тепловой стресс-тест и следите, нет ли мерцания или пропадания подсветки.
  disclaimer:
    title: 'Перед началом: отказ от ответственности'
    p1: Я не мастер по ремонту, а студент направления «электротехника и электроника». Описанное здесь основано на информации, собранной в интернете, моём чтении даташитов, моих выводах, а также на работах и измерениях, которые я лично выполнил на своём устройстве; нет гарантии, что на любом устройстве результат будет таким же.
    p2: 'Все измерения и действия из этого руководства вы выполняете полностью на свою ответственность. Обратите особое внимание на следующее:'
    items:
    - Перед пайкой или разборкой отключите зарядное устройство, убедитесь, что устройство обесточено, и отсоедините разъём аккумулятора.
    - При измерениях под напряжением соскользнувший щуп может замкнуть соседние выводы и повредить оборудование; используйте тонкие щупы и держите их неподвижно на площадках.
    - При работе феном защитите каптоновым скотчем мелкие конденсаторы рядом с датчиком и разъёмы, например JIR2.
    - При работе с платой соблюдайте меры защиты от статического электричества (ESD).
    - Если снимали радиатор, замените термопасту и затяните винты в указанном порядке.
    - Если не уверены в каком-либо шаге, остановитесь и обратитесь к опытному специалисту.
  support:
    title: Руководство помогло?
    text: 'Если руководство помогло починить ноутбук, поставьте звезду на GitHub: так другие владельцы Victus быстрее его найдут.'
    cta: Поставить звезду на GitHub
ko:
  brand: Victus 16 홀 센서 가이드
  description: HP Victus 16 노트북의 홀 효과 센서 및 FU6 퓨즈 고장 진단과 수리 (Toshiba TCS40DLR LA8을 Allegro A1126으로 교체).
  skip: 본문으로 건너뛰기
  contents: 목차
  language: 언어
  theme: 라이트/다크 테마 전환
  repo: GitHub 저장소
  preview: 이미지 미리보기
  close: 닫기
  figure: 그림
  anchor: 이 섹션 링크
  zoom: 클릭하여 확대
  read_guide: 가이드 읽기
  other_langs: 다른 언어
  summary:
    title: 요약
    symptom_k: 증상
    symptom: 주로 높은 발열 부하에서 화면과 키보드 백라이트가 무작위로 꺼지거나 깜빡이며, 시스템이 덮개가 닫힌 것처럼 동작합니다.
    cause_k: 원인
    cause: 홀 센서 3.3 V 전원 라인의 FU6 퓨즈가 열로 열화되어 저항이 증가합니다. 또한 원래 센서인 Toshiba TCS40DLR(LA8)은 최대 85 °C까지만 보장됩니다.
    fix_k: 해결
    fix: 센서를 Allegro A1126으로 교체하고 FU6를 바이패스합니다(또는 새 퓨즈 장착). 둘 중 하나만 해서는 충분하지 않습니다.
    level_k: 난이도
    level: '고급: SMD 납땜, 회로도 판독, 멀티미터 측정이 필요합니다. 메인보드와 히트싱크를 분리해야 합니다.'
  diagram:
    title: 홀 센서 전원 경로
    mb: 메인보드
    sb: 센서 보드
    rail: 3V3 라인
    cable: FFC 케이블
    sensor: 홀 센서
    ec: EC
    out: 출력 (FFC)
    light: 화면 및 키보드 백라이트
    caption: FU6는 센서 전원과 직렬로 연결되어 있으므로, 퓨즈의 저항이 커지면 센서에 도달하기 전에 전압이 떨어집니다. 이는 단순화한 블록도이며, 센서 출력은 EC에 도달하기 전에 메인보드의 중간 회로를 거칠 수 있습니다.
  variant:
    title: 보드에서 FU6를 찾을 수 없나요?
    p1: '이 가이드는 퓨즈가 FU6로 표기되어 있고 JIR1 커넥터 바로 옆에 있는 제 메인보드를 기준으로 합니다. 다른 보드 변형(예: Intel 기반)에서는 해당 퓨즈가 메인보드 뒷면에 FN2로 표기되어 있을 가능성이 높습니다. 이는 포럼 사례에서 나온 정보로 확실하지 않습니다. 퓨즈를 찾으려면 JIR1 커넥터에서 홀 센서의 3.3V 라인을 거슬러 따라가십시오.'
    p2: 퓨즈 상태를 확실히 진단하려면 다음 두 가지 측정을 모두 해야 합니다.
    items:
    - 보드에 전원이 없는 상태에서 퓨즈 양단 사이의 도통 테스트를 통과해야 합니다(부저가 울려야 함). 부저가 울리지 않고 멀티미터에 저항값이 표시되면 퓨즈가 열화된 것입니다.
    - 보드에 전원이 들어간 상태에서 퓨즈 양단 사이에 눈에 띄는 전압 강하가 없어야 합니다. 정상 퓨즈에서는 사실상 0이며 몇 mV를 넘지 않습니다. 제 고장 난 FU6에서는 30 mV를 측정했습니다.
    p3: 통전 상태에서 측정할 때 주의하십시오. 프로브가 미끄러지면 인접 핀이 단락되어 하드웨어가 손상될 수 있습니다. 먼저 전원이 없는 상태에서 도통 테스트로 어느 핀에 3V3이 흘러야 하는지 확인하십시오.
  checklist:
    title: 수리 후
    items:
    - 모든 납땜 부위를 도통 테스트로 확인합니다.
    - 보드 전원을 끈 상태에서 도통 테스트로 JIR1의 어느 핀에 3V3이 흘러야 하는지 확인한 다음, 전원을 켜고 해당 핀에서 3.3 V를 조심스럽게 측정합니다.
    - 새 서멀 페이스트를 바르고 히트싱크를 장착한 뒤 지정된 순서대로 나사를 조입니다.
    - 키보드 백라이트를 켜고 덮개를 몇 번 열고 닫습니다. 화면과 백라이트가 덮개 동작을 정확히 따라야 합니다.
    - 장시간 발열 스트레스 테스트를 실행하고 깜빡임이나 백라이트 꺼짐이 없는지 확인합니다.
  disclaimer:
    title: '시작하기 전에: 면책 조항'
    p1: 저는 수리 기술자가 아니라 전기전자공학을 전공하는 학생입니다. 이 가이드의 내용은 인터넷에서 모은 정보, 데이터시트에 대한 제 해석, 제 결론, 그리고 제 기기에서 직접 수행한 작업과 측정을 바탕으로 합니다. 모든 기기에서 같은 결과를 보장하지 않습니다.
    p2: 이 가이드의 모든 측정과 작업은 전적으로 본인의 책임입니다. 특히 다음 사항에 주의하십시오.
    items:
    - 납땜이나 분해 전에 충전기를 분리하고, 기기에 전원이 없는지 확인한 뒤 배터리 커넥터를 분리합니다.
    - 통전 측정 중 프로브가 미끄러지면 인접 핀이 단락되어 하드웨어가 손상될 수 있습니다. 끝이 가는 프로브를 사용하고 패드 위에서 흔들리지 않게 고정하십시오.
    - 열풍기를 사용할 때는 센서 주변의 작은 커패시터와 JIR2 같은 커넥터를 캡톤 테이프로 보호합니다.
    - 보드 작업 중에는 정전기 방전(ESD)에 대비하십시오.
    - 히트싱크를 분리했다면 서멀 페이스트를 새로 바르고 지정된 순서대로 나사를 조입니다.
    - 어떤 단계가 확실하지 않다면 작업을 멈추고 경험자의 도움을 받으십시오.
  support:
    title: 도움이 되었나요?
    text: 이 가이드로 노트북을 고치셨다면 GitHub에서 스타를 눌러 주세요. 다른 Victus 사용자들이 더 쉽게 찾을 수 있습니다.
    cta: GitHub에서 스타 주기
